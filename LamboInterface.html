<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini | The Void Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        nav a:hover {
            opacity: 1;
        }
        .hero {
            min-height: 85vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 50px;
            max-width: 1400px;
            margin: 0 auto;
            gap: 40px;
        }
        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }
        .hero h1 {
            font-size: clamp(40px, 5vw, 80px);
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 18px;
            opacity: 0.6;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .btn-gold {
            background-color: #FFC000;
            color: #000000;
            padding: 16px 36px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 0;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .btn-gold:hover {
            background-color: #e5ab00;
        }
        .hero-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-image {
            width: 100%;
            max-height: 550px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Responsive breakdown for smaller mobile screens */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 30px 20px;
            }
            .hero-content {
                align-items: center;
            }
            .hero p {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Lamborghini</div>
        <nav>
            <a href="#">Models</a>
            <a href="#">Power</a>
            <a href="#">Experience</a>
        </nav>
    </header>
    <main class="hero">
        <div class="hero-content">
            <h1>Uncompromising<br>Aero Power</h1>
            <p>Experience true darkness and sharp engineering built from the ground up for high-velocity dominance.</p>
            <a href="#" class="btn-gold">Explore Model</a>
        </div>
        <div class="hero-image-container">
            <img class="hero-image" src="https://unsplash.com" alt="Lamborghini Supercar">
        </div>
    </main>
</body>
</html>
